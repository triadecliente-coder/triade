<!DOCTYPE html>
<html lang="pt-BR" translate="no" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="theme-color" content="#011B35" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <title>Tríade Logística</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script>
      (function() {
        function applyTheme() {
          const saved = localStorage.getItem('triade_theme_mode');
          let isDark = true;
          if (saved === 'light') {
            isDark = false;
          } else if (saved === 'dark') {
            isDark = true;
          } else if (window.matchMedia) {
            isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        }
        applyTheme();
        if (window.matchMedia) {
          window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function() {
            if (!localStorage.getItem('triade_theme_mode')) {
              applyTheme();
            }
          });
        }
      })();
      if (window.tailwind) {
        tailwind.config = {
          darkMode: 'class',
          theme: {
          extend: {
            colors: {
              'primary': '#EC2907',       // Tríade Vermelho-Laranja Vibrante
              'primary-dark': '#C41C00',   // Carmesim Profundo (Dobras do Símbolo)
              'accent': '#FF4D00',        // Laranja Chama Luminoso
              'accent-dark': '#D93B00',    // Laranja Queimado (Hover)
              'brand-navy': '#011B35',    // Azul Marinho Meia-Noite (Tipografia TRÍADE)
              'secondary': '#64748B',     // Slate Gray
              'light-bg': '#F8FAFC',      // Superfície Clara
              'light-card': '#FFFFFF',
              'dark-bg': '#041020',       // Fundo Escuro Navy Tríade
              'dark-card': '#0A1C34',     // Card Escuro Navy Tríade
            },
          },
        },
      }
    }
    </script>
    <link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-light-bg dark:bg-dark-bg">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
